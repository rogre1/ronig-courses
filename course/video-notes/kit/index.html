<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הערות על הסרטון</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap">
<style>
/* layout: header, then the player (right) and the notes bank (left); stacked on a phone */
:root{--navy:#27415E;--navy2:#34557A;--blue:#4F7DB0;--turq:#7FE3D8;--tq-soft:#E7F8F6;--pale:#EEF3F8;--line:#DDE5EE;--ink:#1C2A3B;--mut:#5F6D7E;--coral:#E5484D}
*{box-sizing:border-box}
body{margin:0;background:var(--pale);color:var(--ink);font-family:Assistant,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
header{background:radial-gradient(120% 140% at 85% 0%,#3A5E87 0%,var(--navy) 62%);color:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:25px;font-weight:800;line-height:1.2}
header .file{font-size:15px;opacity:.75;direction:ltr}
header .ver{margin-inline-start:auto;background:var(--turq);color:var(--navy);font-weight:800;border-radius:99px;padding:4px 14px;font-size:16px}
.brand{font-weight:300;opacity:.85;font-size:16px}
.brand b{font-weight:800;color:var(--turq)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;margin-top:18px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px}
/* player */
.stage{position:relative;margin:0 auto;aspect-ratio:9/16;max-height:68vh;width:100%;max-width:calc(68vh * 9 / 16);border-radius:16px;overflow:hidden;background:#0E1622}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.stage.drawing canvas{pointer-events:auto;cursor:crosshair}
.stage.drawing::after{content:'מסמנים על הפריים';position:absolute;top:10px;right:10px;background:rgba(39,65,94,.85);color:#fff;font-size:14px;font-weight:700;border-radius:99px;padding:3px 10px;pointer-events:none}
.ctrl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;direction:ltr;flex-wrap:wrap}
.ctrl button{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:99px;padding:5px 11px;font-size:15px;font-weight:700;min-width:44px}
.ctrl button:hover{border-color:var(--turq)}
.ctrl .play{background:var(--navy);border-color:var(--navy);color:#fff;min-width:56px}
.time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);font-size:16px;margin-left:6px}
.bar{position:relative;height:30px;margin-top:10px;direction:ltr;cursor:pointer;touch-action:none}
.bar .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:99px;background:var(--line)}
.bar .fill{position:absolute;left:0;top:12px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--navy));width:0}
.bar .head{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--navy);left:0}
.bar .mk{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;padding:0;border-radius:50%;background:var(--turq);border:2px solid var(--navy);cursor:pointer;z-index:2}
.bar .mk:hover{transform:scale(1.3)}
.barlbl{font-size:13.5px;color:var(--mut);text-align:center;margin-top:-2px}
.toast{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;background:var(--navy);color:#fff;border-radius:12px;padding:8px 12px;font-size:15.5px}
.toast[hidden]{display:none}
.toast button{border:0;background:var(--turq);color:var(--navy);font-weight:800;border-radius:99px;padding:3px 12px}
.note:hover img{outline:2px solid var(--turq)}
.addbtn{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;background:var(--turq);color:var(--navy);font-weight:800;font-size:19px;padding:12px}
.addbtn:hover{filter:brightness(.96)}
.keys{margin:10px 0 0;text-align:center;font-size:14px;color:var(--mut)}
.keys kbd{font-family:inherit;background:var(--pale);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
/* composer */
.composer{margin-top:12px;border:2px solid var(--turq);border-radius:16px;padding:12px;background:var(--tq-soft)}
.composer[hidden]{display:none}
.composer .at{font-weight:800;color:var(--navy)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tools button{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:99px;padding:4px 12px;font-size:15px;font-weight:700}
.tools button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.composer textarea{width:100%;min-height:72px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;resize:vertical;background:#fff}
.composer textarea:focus{outline:none;border-color:var(--blue)}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1;border-radius:99px;padding:8px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--navy)}
.row2 .save{background:var(--navy);border-color:var(--navy);color:#fff}
/* notes bank */
.bank h2{margin:0;font-size:21px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.bank h2 span{font-size:15px;font-weight:700;color:var(--mut)}
.send{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;font-size:18px;padding:12px}
.send.ok{background:var(--turq);color:var(--navy)}
.hint{font-size:14px;color:var(--mut);margin:8px 2px 0}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.note{display:grid;grid-template-columns:64px 1fr;gap:12px;border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;cursor:pointer}
.note:hover{border-color:var(--turq)}
.note.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--tq-soft)}
.note img,.note .ph{width:64px;height:114px;border-radius:10px;object-fit:cover;background:#0E1622;display:block}
.note .t{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.note .t small{font-weight:600;color:var(--mut);margin-left:6px}
.note p{margin:2px 0 6px;font-size:16.5px}
.note .acts{display:flex;gap:6px;flex-wrap:wrap}
.note .acts button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700}
.note .acts button:hover{border-color:var(--turq)}
.empty{color:var(--mut);text-align:center;padding:22px 8px}
.preview{margin-top:12px;background:var(--navy);color:#E3ECF5;border-radius:14px;padding:12px;font-size:14.5px;white-space:pre-wrap;line-height:1.6}
.preview b{color:var(--turq);display:block;margin-bottom:4px;font-size:13px}
@media (max-width:760px){.grid{grid-template-columns:1fr}.stage{max-height:62vh;max-width:calc(62vh * 9 / 16)}header h1{font-size:22px}}
.newver{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--turq);color:var(--navy);font-weight:800;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:17px}
.newver[hidden]{display:none}
.newver button{border:0;background:var(--navy);color:#fff;font-weight:800;border-radius:99px;padding:5px 16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="newver" id="newver" hidden>יש גרסה חדשה של הסרטון <button onclick="location.reload()">לפתוח אותה</button></div>
  <header>
    <div>
      <h1>הערות על הסרטון</h1>
      <div class="file" id="file"></div>
    </div>
    <span class="ver" id="ver"></span>
  </header>

  <div class="grid">
    <section class="card">
      <div class="stage" id="stage">
        <video id="v" playsinline preload="auto" ></video>
        <canvas id="cv"></canvas>
      </div>
      <div class="ctrl">
        <button id="b1" title="שנייה אחורה">−1 ש׳</button>
        <button id="bP" class="play" title="ניגון / עצירה">▶</button>
        <button id="f1" title="שנייה קדימה">+1 ש׳</button>
        <span class="time" id="tm">00:00.0</span>
      </div>
      <div class="bar" id="bar"><div class="track"></div><div class="fill" id="fill"></div><div id="mks"></div><div class="head" id="head"></div></div>
      <button class="addbtn" id="add">＋ הערה ברגע הזה</button>
      <div class="composer" id="comp" hidden>
        <div>הערה ב-<span class="at" id="at"></span></div>
        <div class="tools" role="group" aria-label="סימון על הפריים">
          <button data-tool="none" aria-pressed="true">בלי סימון</button>
          <button data-tool="circle" aria-pressed="false">◯ עיגול</button>
          <button data-tool="arrow" aria-pressed="false">↗ חץ</button>
          <button data-tool="box" aria-pressed="false">▢ אזור</button>
        </div>
        <textarea id="txt" placeholder="מה לשנות ברגע הזה?"></textarea>
        <div class="row2"><button class="save" id="save">שמירה</button><button id="cancel">ביטול</button></div>
      </div>
    </section>

    <section class="card bank">
      <h2>בנק הערות <span id="cnt"></span></h2>
      <p class="hint" style="margin-top:4px">לחיצה על הערה מחזירה את הסרטון לרגע שלה ומראה עליו את הסימון.</p>
      <ul class="list" id="list"></ul>
      <button class="send" id="send">העתקת ההערות לקלוד</button>
      <p class="hint">אחרי ההעתקה מדביקים בשיחה עם קלוד. לא צריך צילומי מסך.</p>
      <div class="toast" id="toast" hidden><span></span><button>ביטול</button></div>
      <div class="preview" id="pv" hidden><b>מה יודבק בשיחה</b><span id="pvt"></span></div>
    </section>
  </div>
</div>

<script>
function main(CFG){
var VERSION=CFG.version, FILE=CFG.name, FPS=CFG.fps||30, KEY='vnotes:'+FILE+':v'+VERSION;
var v=document.getElementById('v');v.setAttribute('src',CFG.video);document.getElementById('ver').textContent='גרסה '+VERSION;document.getElementById('file').textContent=FILE;document.title='הערות · '+FILE+' · גרסה '+VERSION;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
var list=document.getElementById('list'),comp=document.getElementById('comp'),txt=document.getElementById('txt');
var notes=[],draft=null,editing=null,tool='none',drag=null,activeId=null;

function fmt(t){t=Math.max(0,t||0);var m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0');}
function pct(x){return Math.round(x*100)+'%';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(j))return j;}catch(e){}return null;}
function store(){try{localStorage.setItem(KEY,JSON.stringify(notes.map(function(n){return{id:n.id,c:n.c,t:n.t,text:n.text,mark:n.mark};})));}catch(e){}}

// marks are kept as fractions of the frame (0..1), so they survive any player size
function drawMark(c,w,h,m){
  if(!m)return;
  c.save();c.lineCap='round';c.lineJoin='round';
  var lw=Math.max(3,w*0.012);
  function stroke(path){c.lineWidth=lw+4;c.strokeStyle='rgba(14,22,34,.85)';path();c.stroke();c.lineWidth=lw;c.strokeStyle='#7FE3D8';path();c.stroke();}
  if(m.type==='circle'||m.type==='box'){
    var x1=Math.min(m.x1,m.x2)*w,x2=Math.max(m.x1,m.x2)*w,y1=Math.min(m.y1,m.y2)*h,y2=Math.max(m.y1,m.y2)*h;
    stroke(function(){c.beginPath();if(m.type==='circle')c.ellipse((x1+x2)/2,(y1+y2)/2,Math.max(2,(x2-x1)/2),Math.max(2,(y2-y1)/2),0,0,Math.PI*2);else c.rect(x1,y1,x2-x1,y2-y1);});
  }else if(m.type==='arrow'){
    var ax=m.x1*w,ay=m.y1*h,bx=m.x2*w,by=m.y2*h,a=Math.atan2(by-ay,bx-ax),hl=Math.max(14,w*0.06);
    stroke(function(){c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.moveTo(bx,by);c.lineTo(bx-hl*Math.cos(a-0.5),by-hl*Math.sin(a-0.5));c.moveTo(bx,by);c.lineTo(bx-hl*Math.cos(a+0.5),by-hl*Math.sin(a+0.5));});
  }
  c.restore();
}
// the video sits letterboxed inside the stage; marks are relative to the picture, not the box
function box(){var r=stage.getBoundingClientRect(),vw=v.videoWidth||9,vh=v.videoHeight||16,s=Math.min(r.width/vw,r.height/vh),w=vw*s,h=vh*s;return{r:r,x:(r.width-w)/2,y:(r.height-h)/2,w:w,h:h};}
function paint(){
  var r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*d)){cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);}
  ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);
  var m=draft?draft.mark:(activeId&&Math.abs(v.currentTime-(byId(activeId)||{}).t)<0.08?(byId(activeId)||{}).mark:null);
  if(m){var b=box();ctx.save();ctx.translate(b.x,b.y);drawMark(ctx,b.w,b.h,m);ctx.restore();}
}
function byId(id){for(var i=0;i<notes.length;i++)if(notes[i].id===id)return notes[i];return null;}

var tv=document.createElement('video');tv.muted=true;tv.preload='auto';tv.playsInline=true;tv.src=v.getAttribute('src');
var shotQ=Promise.resolve();
function frameImage(t,mark,w){
  shotQ=shotQ.then(function(){return new Promise(function(res){
    function go(){
      var vw=tv.videoWidth,vh=tv.videoHeight,h=Math.round(w*vh/vw),c=document.createElement('canvas');c.width=w;c.height=h;
      var x=c.getContext('2d');x.drawImage(tv,0,0,w,h);drawMark(x,w,h,mark);
      try{res(c.toDataURL('image/jpeg',.85));}catch(e){res(null);}
    }
    function seek(){if(Math.abs(tv.currentTime-t)<0.01&&tv.readyState>=2)go();else{tv.addEventListener('seeked',function f(){tv.removeEventListener('seeked',f);go();});tv.currentTime=t;}}
    if(tv.readyState>=1)seek();else tv.addEventListener('loadedmetadata',seek,{once:true});
  });});
  return shotQ;
}

// timeline
var bar=document.getElementById('bar'),fill=document.getElementById('fill'),head=document.getElementById('head'),mks=document.getElementById('mks');
function tick(){var d=v.duration||1,p=Math.min(1,v.currentTime/d)*100;fill.style.width=p+'%';head.style.left=p+'%';document.getElementById('tm').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);paint();}
function markers(){var d=v.duration||1;mks.innerHTML=notes.map(function(n){var i=num(n)-1;return '<button class="mk" data-id="'+n.id+'" style="left:'+(n.t/d*100)+'%" title="הערה '+(i+1)+' · '+fmt(n.t)+': '+esc(n.text||'')+'" aria-label="מעבר להערה '+(i+1)+'"></button>';}).join('');}
mks.addEventListener('pointerdown',function(e){var b=e.target.closest('.mk');if(!b)return;e.stopPropagation();jump(byId(b.dataset.id));});
function jump(n){if(!n)return;v.pause();activeId=n.id;v.currentTime=n.t;render();var li=list.querySelector('[data-id="'+n.id+'"]');if(li)li.scrollIntoView({block:'nearest',behavior:'smooth'});}
function seekFromBar(e){var r=bar.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));v.currentTime=p*(v.duration||0);}
bar.addEventListener('pointerdown',function(e){bar.setPointerCapture(e.pointerId);seekFromBar(e);bar.onpointermove=seekFromBar;});
bar.addEventListener('pointerup',function(){bar.onpointermove=null;});
v.addEventListener('timeupdate',tick);v.addEventListener('seeked',tick);
function ready(){tick();markers();thumbs();}
window.addEventListener('resize',paint);

function playPause(){if(v.paused){closeComposer();v.play();}else v.pause();}
v.addEventListener('play',function(){document.getElementById('bP').textContent='❚❚';});
v.addEventListener('pause',function(){document.getElementById('bP').textContent='▶';});
function step(s){v.pause();v.currentTime=Math.min(v.duration||0,Math.max(0,v.currentTime+s));}
document.getElementById('bP').onclick=playPause;
document.getElementById('b1').onclick=function(){step(-1);};document.getElementById('f1').onclick=function(){step(1);};
stage.addEventListener('click',function(){if(!stage.classList.contains('drawing'))playPause();});

// composer
function setTool(t){tool=t;document.querySelectorAll('.tools button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.tool===t);});stage.classList.toggle('drawing',t!=='none');if(t==='none'&&draft){draft.mark=null;paint();}}
document.querySelectorAll('.tools button').forEach(function(b){b.onclick=function(){setTool(b.dataset.tool);};});
function openComposer(n){
  v.pause();editing=n||null;draft={t:n?n.t:v.currentTime,mark:n&&n.mark?JSON.parse(JSON.stringify(n.mark)):null};
  if(n)v.currentTime=n.t;
  document.getElementById('at').textContent=fmt(draft.t);txt.value=n?n.text:'';comp.hidden=false;
  setTool(draft.mark?draft.mark.type:'none');txt.focus();paint();
}
function closeComposer(){comp.hidden=true;draft=null;editing=null;setTool('none');paint();}
document.getElementById('add').onclick=function(){openComposer(null);};
document.getElementById('cancel').onclick=closeComposer;
document.getElementById('save').onclick=function(){
  var t=txt.value.trim();if(!t&&!draft.mark){txt.focus();return;}
  var n=editing||{id:Date.now().toString(36),c:Date.now()};n.t=draft.t;n.text=t;n.mark=draft.mark;
  if(!editing)notes.push(n);
  frameImage(n.t,n.mark,180).then(function(u){n.img=u;render();});
  activeId=n.id;closeComposer();store();render();markers();
};
function pos(e){var b=box(),r=b.r;return{x:Math.min(1,Math.max(0,(e.clientX-r.left-b.x)/b.w)),y:Math.min(1,Math.max(0,(e.clientY-r.top-b.y)/b.h))};}
cv.addEventListener('pointerdown',function(e){if(tool==='none'||!draft)return;cv.setPointerCapture(e.pointerId);var p=pos(e);drag=p;draft.mark={type:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y};paint();});
cv.addEventListener('pointermove',function(e){if(!drag)return;var p=pos(e);draft.mark.x2=p.x;draft.mark.y2=p.y;paint();});
cv.addEventListener('pointerup',function(){drag=null;if(draft&&draft.mark&&Math.abs(draft.mark.x2-draft.mark.x1)<0.02&&Math.abs(draft.mark.y2-draft.mark.y1)<0.02){var m=draft.mark;if(m.type==='arrow'){m.x1=Math.max(0,m.x2-0.15);m.y1=Math.min(1,m.y2+0.12);}else{m.x1-=0.1;m.x2+=0.1;m.y1-=0.06;m.y2+=0.06;}paint();}});

// bank
function where(m){
  function side(x,y){var h=x<0.34?'צד שמאל':x>0.66?'צד ימין':'',vv=y<0.34?'למעלה':y>0.66?'למטה':'';return (h&&vv)?h+' '+vv:(h||(vv?'מרכז '+vv:'מרכז הפריים'));}
  if(m.type==='arrow')return 'חץ שמצביע על '+side(m.x2,m.y2)+': מתחיל ב-'+pct(m.x1)+' מהרוחב ו-'+pct(m.y1)+' מהגובה, ומסתיים ב-'+pct(m.x2)+' מהרוחב ו-'+pct(m.y2)+' מהגובה';
  var x1=Math.min(m.x1,m.x2),x2=Math.max(m.x1,m.x2),y1=Math.min(m.y1,m.y2),y2=Math.max(m.y1,m.y2);
  return (m.type==='circle'?'עיגול':'מלבן')+', '+side((x1+x2)/2,(y1+y2)/2)+', '+pct(x1)+'–'+pct(x2)+' מהרוחב ו-'+pct(y1)+'–'+pct(y2)+' מהגובה';
}
function written(){return notes.slice().sort(function(a,b){return (a.c||0)-(b.c||0);});}
function num(n){return written().indexOf(n)+1;}
function text(){
  var L=['הערות על גרסה '+VERSION+' של הסרטון '+FILE+':'];
  written().forEach(function(n,i){L.push((i+1)+'. '+fmt(n.t)+': '+(n.text||'(בלי טקסט)')+(n.mark?' [סימון: '+where(n.mark)+']':''));});
  L.push('','האחוזים נמדדים מהפינה השמאלית העליונה של הפריים. תחלץ את הפריים של כל הערה, תצייר עליו את הסימון ותסתכל לפני שאתה מתקן.');
  return L.join('\n');
}
function render(){
  document.getElementById('cnt').textContent=notes.length?'('+notes.length+')':'';
  if(!notes.length){list.innerHTML='<li class="empty">עוד אין הערות. עוצרים ברגע שצריך לשנות ולוחצים "הערה ברגע הזה".</li>';}
  else list.innerHTML=written().reverse().map(function(n){var i=num(n)-1;
    return '<li class="note'+(n.id===activeId?' on':'')+'" data-id="'+n.id+'">'+(n.img?'<img alt="" src="'+n.img+'">':'<span class="ph"></span>')+
      '<div><div class="t">'+fmt(n.t)+'<small>#'+(i+1)+(n.mark?' · עם סימון':'')+'</small></div><p>'+esc(n.text||'(בלי טקסט)')+'</p>'+
      '<div class="acts"><button data-a="edit">עריכה</button><button data-a="del">מחיקה</button>'+(n.mark?'<button data-a="img">שמירת תמונה</button>':'')+'</div></div></li>';
  }).join('');
  var pv=document.getElementById('pv');pv.hidden=!notes.length;document.getElementById('pvt').textContent=notes.length?text():'';
}
list.addEventListener('click',function(e){
  var li=e.target.closest('.note');if(!li)return;var n=byId(li.dataset.id),a=e.target.dataset.a;
  if(a==='del'){var at=notes.indexOf(n);notes.splice(at,1);if(activeId===n.id)activeId=null;store();render();markers();paint();toast('ההערה נמחקה',function(){notes.splice(at,0,n);store();render();markers();});return;}
  if(a==='edit'){openComposer(n);return;}
  if(a==='img'){frameImage(n.t,n.mark,v.videoWidth).then(function(u){if(!u)return;var l=document.createElement('a');l.href=u;l.download='frame-'+fmt(n.t).replace(/[:.]/g,'-')+'.jpg';document.body.appendChild(l);l.click();l.remove();});return;}
  jump(n);
});
var tw=document.getElementById('toast'),tt=null;
function toast(msg,undo){tw.querySelector('span').textContent=msg;tw.hidden=false;var b=tw.querySelector('button');b.onclick=function(){tw.hidden=true;clearTimeout(tt);undo();};clearTimeout(tt);tt=setTimeout(function(){tw.hidden=true;},6000);}
document.getElementById('send').onclick=function(){
  if(!notes.length)return;var t=text(),b=this;
  function ok(){b.textContent='הועתק ✓ עכשיו מדביקים בשיחה';b.classList.add('ok');setTimeout(function(){b.textContent='העתקת ההערות לקלוד';b.classList.remove('ok');},3500);}
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(x){}a.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
};
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='TEXTAREA'){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))document.getElementById('save').click();if(e.key==='Escape')closeComposer();return;}
  if(e.key===' '){e.preventDefault();playPause();}else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='n'||e.key==='N'||e.key==='מ'){e.preventDefault();openComposer(null);}
});

notes=load()||[];
render();
if(v.readyState>=2)ready();else v.addEventListener('loadeddata',ready,{once:true});
function thumbs(){notes.forEach(function(n){if(!n.img)frameImage(n.t,n.mark,180).then(function(u){n.img=u;render();});});}
}
// current.json says which video and version to show; Claude rewrites it after every render
function cfgUrl(){return 'current.json?'+Date.now();}
fetch(cfgUrl()).then(function(r){return r.json();}).then(function(cfg){
  main(cfg);
  setInterval(function(){fetch(cfgUrl()).then(function(r){return r.json();}).then(function(n){
    if(n.version!==cfg.version||n.video!==cfg.video)document.getElementById('newver').hidden=false;
  }).catch(function(){});},4000);
}).catch(function(){document.querySelector('.wrap').insertAdjacentHTML('beforeend','<p class="empty">לא מצאתי את current.json. צריך לפתוח את העמוד דרך השרת שקלוד מפעיל.</p>');});
</script>
</body>
</html>
